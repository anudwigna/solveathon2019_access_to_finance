name: MunshiG
description: A new Flutter application.
publish_to: none
version: 1.1.0+5

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  country_pickers: ^3.0.1
  device_info_plus: ^11.5.0
  dio: ^5.9.0
  excel: ^4.0.6
  flutter:
    sdk: flutter
  flutter_email_sender: ^7.0.0
  flutter_getit: ^3.0.1
  flutter_image_compress: ^2.4.0
  flutter_svg: ^2.2.0
  fluttertoast: ^8.2.12
  image_picker: ^1.2.0
  intl: ^0.20.2
  material_design_icons_flutter: ^7.0.7296
  nepali_date_picker: ^7.0.1
  nepali_utils: ^3.0.8
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  progress_dialog:
    git:
      url: https://github.com/Rishan99/progress-dialog
      ref: main
  provider: ^6.1.5
  sembast: ^3.8.5+1
  sleek_circular_slider: ^2.1.0
  # syncfusion_flutter_xlsio: ^30.2.5

dev_dependencies:
  build_runner: ^2.7.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.10.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/language/
    - fonts/

  fonts:
    - family: FontAwesomeBrands
      fonts:
        - asset: assets/FontAwesome5_Brands.ttf
    - family: FontAwesomeRegular
      fonts:
        - asset: assets/FontAwesome5_Regular.ttf
    - family: FontAwesomeSolid
      fonts:
        - asset: assets/FontAwesome5_Solid.ttf
    - family: SourceSansPro
      fonts:
        - asset: fonts/SourceSansPro-Regular.ttf
        - asset: fonts/SourceSansPro-Italic.ttf
          style: italic
        - asset: fonts/SourceSansPro-Black.ttf
          weight: 900
        - asset: fonts/SourceSansPro-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: fonts/SourceSansPro-Bold.ttf
          weight: 700
        - asset: fonts/SourceSansPro-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: fonts/SourceSansPro-ExtraLight.ttf
          weight: 200
        - asset: fonts/SourceSansPro-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: fonts/SourceSansPro-Light.ttf
          weight: 300
        - asset: fonts/SourceSansPro-LightItalic.ttf
          weight: 300
          style: italic
        - asset: fonts/SourceSansPro-SemiBold.ttf
          weight: 600
        - asset: fonts/SourceSansPro-SemiBoldItalic.ttf
          weight: 600
          style: italic
  # To add assets to your application, add an assets section, like this:
  # assets:
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.io/assets-and-images/#resolution-aware.
  # For details regarding adding assets from package dependencies, see
  # https://flutter.io/assets-and-images/#from-packages
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.io/custom-fonts/#from-packages
